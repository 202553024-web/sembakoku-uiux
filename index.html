<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SembakoKu — UI/UX Prototype</title>
<style>
:root{--green:#15803d;--green2:#16a34a;--ink:#17231c;--muted:#718078;--line:#e7eee9;--bg:#f5f8f6;--white:#fff;--red:#dc5353;--amber:#d88b16;--shadow:0 8px 28px rgba(24,54,36,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#102d20;color:#d9e9df;padding:22px 15px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:20;transition:.25s}
.brand{display:flex;align-items:center;gap:11px;padding:3px 10px 25px}.brand-mark{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#42c878,#128342);display:grid;place-items:center;color:white;font-weight:900;font-size:16px;box-shadow:0 6px 15px #0a1c13}.brand strong{font-size:17px;letter-spacing:.2px;color:white}.brand small{display:block;color:#8eb29b;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.nav-label{font-size:10px;color:#779986;letter-spacing:1.5px;text-transform:uppercase;padding:13px 11px 7px;font-weight:800}.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#bfd3c6;padding:10px 12px;border-radius:10px;text-align:left;margin:2px 0;font-weight:550}.nav .ico{width:20px;text-align:center;font-size:16px}.nav:hover{background:#1a402d;color:white}.nav.active{background:#1e5637;color:white;box-shadow:inset 3px 0 #5be08a}.side-foot{border-top:1px solid #2b4b38;margin:25px 6px 0;padding:16px 7px;color:#9eb8a7;font-size:11px}
.main{margin-left:250px;width:calc(100% - 250px);min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:10}.crumb{color:var(--muted);font-size:12px}.crumb b{color:#20372a}.top-actions{display:flex;align-items:center;gap:16px}.status{font-size:11px;color:#27804a;background:#e9f8ee;padding:6px 10px;border-radius:30px;font-weight:700}.avatar{width:35px;height:35px;border-radius:50%;background:#e3f5e9;color:#16733a;display:grid;place-items:center;font-weight:800}.user{font-size:12px;font-weight:700}.user small{display:block;color:var(--muted);font-weight:400}.hamb{display:none;border:0;background:none;font-size:22px}
.content{max-width:1440px;margin:auto;padding:30px 32px 45px}.welcome{background:linear-gradient(115deg,#12482c,#198849 68%,#36ad65);border-radius:18px;color:#fff;padding:27px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:240px;height:240px;border:1px solid #ffffff24;border-radius:50%;right:12%;top:-140px;box-shadow:0 0 0 30px #ffffff0d,0 0 0 65px #ffffff08}.welcome h1{font-size:24px;margin:0 0 5px}.welcome p{margin:0;color:#d6f1df}.welcome .btn{position:relative;z-index:1;background:#fff;color:#176c38}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}.page-head h1{font-size:24px;margin:0 0 4px;letter-spacing:-.5px}.page-head p{margin:0;color:var(--muted)}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--green);color:white;font-weight:700;box-shadow:0 3px 8px #15803d20}.btn:hover{filter:brightness(.95)}.btn.light{background:white;color:var(--green);border:1px solid #d8e9dd;box-shadow:none}.btn.gray{background:#edf2ee;color:#43564a;box-shadow:none}.btn.red{background:#fff0f0;color:#bd3e3e;box-shadow:none}.btn.small{padding:6px 10px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:0 3px 14px #193d2910}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;background:#e9f7ee;display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:23px;margin:9px 0 2px;letter-spacing:-.5px}.stat small{color:#87958c;font-size:11px}.positive{color:#168348!important}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:17px;margin-top:17px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:0 3px 14px #193d2909;min-width:0}.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.card-title h3{font-size:15px;margin:0}.card-title span{color:var(--muted);font-size:11px}.bars{height:190px;display:flex;align-items:end;gap:12px;padding:12px 5px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 46px,#eff3f0 47px,#eff3f0 48px)}.bar-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:min(30px,75%);border-radius:6px 6px 2px 2px;background:linear-gradient(#42c879,#168247);min-height:7px}.bar-col small{font-size:10px;color:#849188}.activity{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #f0f3f1}.activity:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:#28a45a;margin-top:5px;flex:none}.activity b{font-size:12px}.activity small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:650px;background:#fff}th{background:#f7faf8;color:#6b7c71;font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:12px 14px;white-space:nowrap}td{padding:13px 14px;border-top:1px solid #edf1ee;font-size:12px;white-space:nowrap}tbody tr:hover{background:#fbfdfb}.pill{display:inline-block;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:800;background:#eaf7ee;color:#187542}.pill.warn{background:#fff4df;color:#a96b0a}.pill.low{background:#ffeded;color:#c13f3f}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 15px}.field{display:flex;flex-direction:column;gap:5px;min-width:140px;flex:1}.field label{font-size:11px;color:#607066;font-weight:700}.field input,.field select,.search{border:1px solid #dfe8e2;border-radius:8px;padding:10px 11px;background:#fff;color:#26382c;outline:none}.field input:focus,.field select:focus,.search:focus{border-color:#43a96b;box-shadow:0 0 0 3px #20a04b15}.search{min-width:220px;flex:1}
.two-col{display:grid;grid-template-columns:1.35fr .8fr;gap:17px}.product-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{border:1px solid var(--line);border-radius:11px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.product b{font-size:12px}.product small{display:block;color:var(--muted);font-size:10px}.price{font-weight:800;color:#176f39;font-size:12px}.qty{display:flex;align-items:center;gap:7px}.qty button{border:0;background:#eaf6ed;color:#187641;border-radius:7px;width:25px;height:25px;font-weight:900}.cart-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.total{display:flex;justify-content:space-between;padding:15px 0;font-size:15px;font-weight:900}
.notice{background:#fff8e9;border:1px solid #f4e4bd;color:#89621c;padding:11px 13px;border-radius:9px;font-size:11px;margin-top:13px}
.footer-note{font-size:11px;color:#89968e;text-align:center;margin-top:25px}
.mobile-overlay{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.two-col{grid-template-columns:1fr}.content{padding:24px 20px}}
@media(max-width:720px){.sidebar{transform:translateX(-100%);width:260px}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block;position:fixed;inset:0;background:#0b1e13a8;z-index:15}.main{margin:0;width:100%}.hamb{display:block}.topbar{padding:0 16px;height:62px}.content{padding:19px 14px 35px}.welcome{padding:21px;align-items:flex-start;flex-direction:column}.welcome h1{font-size:21px}.page-head{flex-direction:column}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:19px}.product-list{grid-template-columns:1fr}.user{display:none}.status{display:none}}
</style>
</head>
<body>
<div class="mobile-overlay" id="overlay" onclick="toggleMenu()"></div>
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark">SK</div><div><strong>SembakoKu</strong><small>Retail management</small></div></div>
 <div class="nav-label">Menu utama</div>
 <button class="nav active" data-page="dashboard" onclick="go('dashboard')"><span class="ico">▦</span>Dashboard</button>
 <button class="nav" data-page="barang" onclick="go('barang')"><span class="ico">▤</span>Data Barang</button>
 <button class="nav" data-page="kasir" onclick="go('kasir')"><span class="ico">▣</span>Kasir / Penjualan</button>
 <button class="nav" data-page="pembelian" onclick="go('pembelian')"><span class="ico">⇩</span>Pembelian</button>
 <button class="nav" data-page="stok" onclick="go('stok')"><span class="ico">◷</span>Kartu Stok</button>
 <div class="nav-label">Keuangan & laporan</div>
 <button class="nav" data-page="pengeluaran" onclick="go('pengeluaran')"><span class="ico">↗</span>Pengeluaran</button>
 <button class="nav" data-page="keuangan" onclick="go('keuangan')"><span class="ico">◈</span>Keuangan</button>
 <button class="nav" data-page="riwayat" onclick="go('riwayat')"><span class="ico">◴</span>Riwayat Penjualan</button>
 <button class="nav" data-page="laporan" onclick="go('laporan')"><span class="ico">▥</span>Laporan</button>
 <div class="nav-label">Pengaturan</div>
 <button class="nav" data-page="aktivitas" onclick="go('aktivitas')"><span class="ico">☷</span>Log Aktivitas</button>
 <button class="nav" data-page="pembayaran" onclick="go('pembayaran')"><span class="ico">▧</span>Pembayaran</button>
 <button class="nav" data-page="pengguna" onclick="go('pengguna')"><span class="ico">♙</span>Pengguna</button>
 <div class="side-foot">Prototype UI/UX • Kelompok 4<br>Mode demonstrasi — data contoh</div>
</aside>
<main class="main">
 <header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="hamb" onclick="toggleMenu()">☰</button><div class="crumb">SembakoKu <span style="color:#b5c0b9">/</span> <b id="crumb">Dashboard</b></div></div><div class="top-actions"><span class="status">● Sistem Demo Aktif</span><div class="avatar">A</div><div class="user">Admin Toko<small>Administrator</small></div></div></header>
 <section class="content" id="view"></section>
</main>
<script>
const products=[
 {code:'BRG001',name:'Beras Premium 5 Kg',cat:'Beras',unit:'Karung',stock:24,min:10,price:76000,cost:68000},
 {code:'BRG002',name:'Minyak Goreng 1 L',cat:'Minyak',unit:'Pouch',stock:8,min:12,price:17500,cost:14500},
 {code:'BRG003',name:'Gula Pasir 1 Kg',cat:'Gula',unit:'Kg',stock:31,min:10,price:16500,cost:14000},
 {code:'BRG004',name:'Telur Ayam 1 Kg',cat:'Telur',unit:'Kg',stock:16,min:8,price:29000,cost:26000},
 {code:'BRG005',name:'Tepung Terigu 1 Kg',cat:'Tepung',unit:'Pack',stock:42,min:10,price:12500,cost:9800},
 {code:'BRG006',name:'Mie Instan',cat:'Makanan',unit:'Pcs',stock:6,min:20,price:3500,cost:2700},
 {code:'BRG007',name:'Kopi Bubuk',cat:'Minuman',unit:'Pack',stock:19,min:8,price:14500,cost:11000},
 {code:'BRG008',name:'Susu Kental Manis',cat:'Minuman',unit:'Kaleng',stock:14,min:6,price:12500,cost:9500}
];
let cart={},page='dashboard';
const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
function head(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function stat(label,value,sub,ico){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${ico}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function dashboard(){return `
 <div class="welcome"><div><h1>Selamat datang di SembakoKu 👋</h1><p>Sistem Informasi Persediaan dan Penjualan Toko Sembako</p></div><button class="btn" onclick="go('kasir')">＋ Transaksi Baru</button></div>
 <div class="stats">${stat('Total Jenis Barang','128','Barang terdaftar di toko','▤')}${stat('Transaksi Hari Ini','24','Transaksi penjualan','▣')}${stat('Omzet Hari Ini',rupiah(2845000),'Total penjualan hari ini','↗')}${stat('Stok Perlu Restok','7','Barang di bawah stok minimum','⚠')}</div>
 <div class="grid2"><div class="card"><div class="card-title"><h3>Ringkasan Penjualan</h3><span>7 hari terakhir</span></div><div class="bars">${[45,68,52,83,61,95,74].map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${v}%"></div><small>${['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i]}</small></div>`).join('')}</div></div>
 <div class="card"><div class="card-title"><h3>Aktivitas Terbaru</h3><span>Hari ini</span></div>${[['Transaksi penjualan berhasil','Kasir • 10:42'],['Stok minyak goreng menipis','Sistem • 10:15'],['Pembelian barang dicatat','Admin • 09:30'],['Data barang diperbarui','Admin • 08:52']].map(a=>`<div class="activity"><i class="dot"></i><div><b>${a[0]}</b><small>${a[1]}</small></div></div>`).join('')}</div></div>
 <div class="card" style="margin-top:17px"><div class="card-title"><h3>Perlu Perhatian — Stok Menipis</h3><button class="btn light small" onclick="go('barang')">Lihat semua barang</button></div>${table(['Kode','Nama Barang','Stok','Minimum','Status'],products.filter(p=>p.stock<=p.min).slice(0,4).map(p=>`<tr><td>${p.code}</td><td><b>${p.name}</b></td><td>${p.stock} ${p.unit}</td><td>${p.min}</td><td><span class="pill low">Perlu restok</span></td></tr>`))}</div>`}
function barang(){return `${head('Data Barang','Kelola informasi barang, kategori, harga, dan batas minimum stok.','<button class="btn" onclick="alert(&quot;Form tambah barang pada prototype&quot;)">＋ Tambah Barang</button>')}<div class="card"><div class="toolbar"><input class="search" id="searchBarang" placeholder="Cari kode, nama, atau kategori barang..." oninput="filterBarang()"><select class="search" style="max-width:180px" onchange="filterBarang()" id="filterCat"><option value="">Semua kategori</option>${[...new Set(products.map(p=>p.cat))].map(c=>`<option>${c}</option>`).join('')}</select></div><div id="barangTable">${barangTable(products)}</div></div>`}
function barangTable(data){return table(['Kode','Nama Barang','Kategori','Satuan','Stok','Harga Jual','Status','Aksi'],data.map(p=>`<tr><td>${p.code}</td><td><b>${p.name}</b></td><td>${p.cat}</td><td>${p.unit}</td><td>${p.stock}</td><td>${rupiah(p.price)}</td><td><span class="pill ${p.stock<=p.min?'low':''}">${p.stock<=p.min?'Stok rendah':'Tersedia'}</span></td><td><button class="btn light small" onclick="alert('Edit ${p.name}')">Edit</button></td></tr>`))}
function filterBarang(){let q=document.getElementById('searchBarang').value.toLowerCase(),c=document.getElementById('filterCat').value;document.getElementById('barangTable').innerHTML=barangTable(products.filter(p=>(p.name+' '+p.code+' '+p.cat).toLowerCase().includes(q)&&(!c||p.cat===c)))}
function kasir(){return `${head('Kasir / Penjualan','Pilih beberapa barang untuk satu transaksi. Stok diperbarui setelah transaksi berhasil.')}<div class="two-col"><div class="card"><div class="card-title"><h3>Pilih Barang</h3><span>Demo katalog</span></div><input class="search" style="width:100%;margin-bottom:13px" id="searchProduct" placeholder="Cari nama barang..." oninput="filterProducts()"><div class="product-list" id="productList">${productCards(products)}</div></div><div class="card"><div class="card-title"><h3>Ringkasan Transaksi</h3><span>Keranjang</span></div><div class="field"><label>Nama pelanggan (opsional)</label><input placeholder="Nama pelanggan"></div><div class="field" style="margin-top:10px"><label>Metode pembayaran</label><select id="payment"><option>Tunai</option><option>Transfer BNI</option></select></div><div id="cartItems" style="margin-top:18px">${cartHtml()}</div><div class="total"><span>Total transaksi</span><span id="cartTotal">${rupiah(cartTotal())}</span></div><button class="btn" style="width:100%" onclick="checkout()">Simpan Penjualan</button><div class="notice">Prototype demonstrasi. Pembayaran transfer BNI pada aplikasi asli memerlukan verifikasi dana masuk secara manual oleh kasir.</div></div></div>`}
function productCards(arr){return arr.map(p=>`<div class="product"><div><b>${p.name}</b><small>${p.code} • Stok ${p.stock}</small><span class="price">${rupiah(p.price)}</span></div><div class="qty"><button onclick="addCart('${p.code}')">+</button></div></div>`).join('')}
function filterProducts(){let q=document.getElementById('searchProduct').value.toLowerCase();document.getElementById('productList').innerHTML=productCards(products.filter(p=>p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)))}
function cartTotal(){return Object.entries(cart).reduce((s,[code,n])=>s+products.find(p=>p.code===code).price*n,0)}
function cartHtml(){let entries=Object.entries(cart);return entries.length?entries.map(([code,n])=>{let p=products.find(x=>x.code===code);return `<div class="cart-row"><span>${p.name}<br><small>${n} × ${rupiah(p.price)}</small></span><b>${rupiah(p.price*n)} <button class="btn red small" onclick="removeCart('${code}')">×</button></b></div>`}).join(''):'<p style="color:#8a978f;text-align:center;padding:25px 0">Belum ada barang dipilih.</p>'}
function addCart(code){cart[code]=(cart[code]||0)+1;render()}
function removeCart(code){delete cart[code];render()}
function checkout(){if(!Object.keys(cart).length){alert('Pilih barang terlebih dahulu.');return}alert('Simulasi berhasil! Total '+rupiah(cartTotal())+'. Data tidak disimpan ke database.');cart={};render()}
function pembelian(){return `${head('Pembelian Barang','Catat penerimaan barang dari pemasok agar stok dan riwayat pembelian terjaga.','<button class="btn" onclick="alert(&quot;Form pembelian prototype&quot;)">＋ Catat Pembelian</button>')}<div class="stats">${stat('Pembelian Bulan Ini','18','Transaksi penerimaan','⇩')}${stat('Total Pembelian',rupiah(12450000),'Nilai pembelian bulan ini','◈')}${stat('Pemasok Aktif','6','Pemasok terdaftar','♙')}${stat('Barang Masuk','86','Item diterima','▤')}</div><div class="card"><div class="card-title"><h3>Riwayat Pembelian</h3><span>Data contoh</span></div>${table(['No. Pembelian','Tanggal','Pemasok','Jenis Barang','Total'],[['PB-001','30 Okt 2026','CV Sumber Pangan','5 jenis',rupiah(2350000)],['PB-002','28 Okt 2026','UD Makmur Jaya','3 jenis',rupiah(1750000)],['PB-003','25 Okt 2026','Toko Grosir Berkah','4 jenis',rupiah(3200000)]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`))}<p class="footer-note">Satu nomor pembelian dapat berisi beberapa jenis barang dalam satu transaksi.</p></div>`}
function stok(){return `${head('Kartu Stok','Riwayat pergerakan stok yang tercatat dari transaksi pembelian dan penjualan.')}<div class="card"><div class="toolbar"><input class="search" placeholder="Cari barang / referensi"><input class="search" type="date" style="max-width:160px"><input class="search" type="date" style="max-width:160px"><button class="btn">Cari</button></div>${table(['Tanggal','Barang','Jenis','Referensi','Perubahan','Sebelum','Sesudah','Dicatat Oleh'],[['30/10/2026 10:42','Beras Premium 5 Kg','Penjualan','PJ-1024','-2','26','24','Kasir'],['30/10/2026 09:30','Minyak Goreng 1 L','Pembelian','PB-001','+12','-','20','Admin'],['29/10/2026 16:20','Gula Pasir 1 Kg','Penjualan','PJ-1021','-3','34','31','Kasir']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`))}<p class="footer-note">Tampilan demonstrasi 500 catatan terbaru.</p></div>`}
function pengeluaran(){return `${head('Pengeluaran Operasional','Catat biaya toko untuk membantu rekonsiliasi keuangan.','<button class="btn" onclick="alert(&quot;Form pengeluaran prototype&quot;)">＋ Catat Pengeluaran</button>')}<div class="stats">${stat('Total Pengeluaran',rupiah(875000),'Periode bulan ini','↗')}${stat('Jumlah Catatan','12','Transaksi biaya','▤')}</div><div class="card">${table(['Tanggal','Kategori','Keterangan','Dicatat Oleh','Jumlah'],[['30 Okt 2026','Listrik','Tagihan listrik toko','Admin',rupiah(350000)],['27 Okt 2026','Transportasi','Pengiriman barang','Admin',rupiah(150000)],['25 Okt 2026','Operasional','Kebutuhan kebersihan','Admin',rupiah(125000)]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`))}</div>`}
function keuangan(){return `${head('Ringkasan Keuangan','Omzet, HPP tersimpan, laba kotor yang dapat dihitung, dan biaya operasional.')}<div class="toolbar"><div class="field"><label>Dari tanggal</label><input type="date" value="2026-10-01"></div><div class="field"><label>Sampai tanggal</label><input type="date" value="2026-10-30"></div><button class="btn" style="align-self:end">Terapkan Periode</button></div><div class="stats">${stat('Omzet Penjualan',rupiah(28450000),'Jumlah transaksi: 214','↗')}${stat('HPP yang Tercatat',rupiah(22100000),'Item dengan snapshot HPP','▤')}${stat('Laba Kotor Terhitung',rupiah(6350000),'Hanya item dengan HPP tersimpan','◈')}${stat('Pengeluaran Operasional',rupiah(875000),'Belum dikurangkan dari laba kotor','⇩')}</div><div class="notice">Perhatian: Laba kotor hanya menghitung item yang memiliki snapshot HPP. Angka ini belum tentu merupakan laba kotor lengkap seluruh periode. Pengeluaran ditampilkan terpisah.</div>`}

function laporan(){return `${head('Laporan Penjualan','Ringkasan kinerja penjualan toko berdasarkan periode.')}<div class="card"><div class="toolbar"><div class="field"><label>Tanggal mulai</label><input type="date" value="2026-10-01"></div><div class="field"><label>Tanggal selesai</label><input type="date" value="2026-10-30"></div><button class="btn" style="align-self:end">Tampilkan Laporan</button><button class="btn light" style="align-self:end" onclick="alert(&quot;Ekspor Excel pada aplikasi asli&quot;)">⇩ Ekspor Excel</button></div><div class="stats">${stat('Total Transaksi','214','Transaksi periode terpilih','▣')}${stat('Total Omzet',rupiah(28450000),'Penjualan kotor','↗')}${stat('Rata-rata Transaksi',rupiah(132944),'Nilai per transaksi','◈')}${stat('Barang Terjual','682','Total unit terjual','▤')}</div><div class="card-title"><h3>Rekap penjualan per hari</h3><span>Oktober 2026</span></div><div class="bars">${[52,65,43,77,60,88,72].map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${v}%"></div><small>${['24','25','26','27','28','29','30'][i]}</small></div>`).join('')}</div></div>`}
function aktivitas(){return `${head('Log Aktivitas','Catatan aktivitas pengguna untuk membantu pemantauan dan audit sistem.')}<div class="card">${table(['Waktu','Pengguna','Aktivitas','Modul','Keterangan'],[['30 Okt 2026 10:42','kasir01','Membuat transaksi','Penjualan','PJ-1024'],['30 Okt 2026 09:30','admin','Mencatat pembelian','Pembelian','PB-001'],['30 Okt 2026 08:52','admin','Memperbarui data barang','Data Barang','BRG003']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`))}</div>`}

function pengguna(){return `${head('Kelola Pengguna','Atur akun Admin dan Kasir. Hanya Admin yang dapat mengelola pengguna.','<button class="btn" onclick="alert(&quot;Form tambah pengguna prototype&quot;)">＋ Tambah Pengguna</button>')}<div class="card">${table(['Username','Peran','Status','Aksi'],[['admin','Administrator','<span class="pill">Aktif</span>','<button class="btn light small">Kelola</button>'],['kasir01','Kasir','<span class="pill">Aktif</span>','<button class="btn light small">Kelola</button>'],['kasir02','Kasir','<span class="pill">Aktif</span>','<button class="btn light small">Kelola</button>']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`))}<p class="footer-note">Pada sistem asli, pengguna baru wajib mengganti password saat login pertama.</p></div>`}
const pages={dashboard,barang,kasir,pembelian,stok,pengeluaran,keuangan,riwayat,laporan,aktivitas,pembayaran,pengguna};
const labels={dashboard:'Dashboard',barang:'Data Barang',kasir:'Kasir / Penjualan',pembelian:'Pembelian',stok:'Kartu Stok',pengeluaran:'Pengeluaran',keuangan:'Keuangan',riwayat:'Riwayat Penjualan',laporan:'Laporan',aktivitas:'Log Aktivitas',pembayaran:'Pembayaran',pengguna:'Pengguna'};
function render(){document.getElementById('view').innerHTML=pages[page]();document.getElementById('crumb').textContent=labels[page];document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));}
function go(p){page=p;render();if(innerWidth<=720)toggleMenu()}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
render();
</script>
</body></html>
